name: Build standalone dylib

on:
  workflow_dispatch:
    inputs:
      macsteam_version:
        description: 'macSteam version (for example 0.2.0; tag: v0.2.0)'
        required: true
        default: '0.2.0'
        type: string
      steam_version:
        description: 'Target Steam version (included in the release description)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MACSTEAM_VERSION: ${{ inputs.macsteam_version }}
      STEAM_VERSION: ${{ inputs.steam_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate versions and prepare release notes
        shell: bash
        run: |
          if [[ ! "$MACSTEAM_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Enter a macSteam version in major.minor.patch format, for example 0.2.0."
            exit 1
          fi
          if [[ ! "$STEAM_VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Enter a numeric Steam version, for example 1788652215."
            exit 1
          fi
          awk -v version="$MACSTEAM_VERSION" '
            $0 == "## [" version "]" { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/changelog.md" || {
            echo "Missing changelog entry for macSteam $MACSTEAM_VERSION."
            exit 1
          }
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/changelog.md"; then
            echo "Changelog entry for macSteam $MACSTEAM_VERSION is empty."
            exit 1
          fi
          {
            printf 'Standalone macSteam %s.\n\nTarget Steam version: `%s`.\n\n' "$MACSTEAM_VERSION" "$STEAM_VERSION"
            cat "$RUNNER_TEMP/changelog.md"
          } > "$RUNNER_TEMP/release-notes.md"
      - name: Test standalone config and installer
        run: make test-standalone
      - name: Build and bundle
        run: make dist
      - name: Verify dylib
        run: |
          lipo out/macsteam.dylib -verify_arch arm64
          lipo out/macsteam.dylib -verify_arch x86_64
          codesign --verify --strict out/macsteam.dylib
          tar -tzf out/macsteam-standalone.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$MACSTEAM_VERSION" out/macsteam-standalone.tar.gz \
            --target "$GITHUB_SHA" \
            --title "macSteam $MACSTEAM_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
