name: Build standalone dylib

on:
  workflow_dispatch:
    inputs:
      steam_version:
        description: 'Target Steam version (release name: steam-{version})'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      STEAM_VERSION: ${{ inputs.steam_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Steam version
        shell: bash
        run: |
          if [[ ! "$STEAM_VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Enter a numeric Steam version, for example 1788652215."
            exit 1
          fi
      - name: Test standalone config and installer
        run: make test-standalone
      - name: Build and bundle
        run: make dist
      - name: Verify dylib
        run: |
          lipo out/macsteam.dylib -verify_arch arm64
          lipo out/macsteam.dylib -verify_arch x86_64
          codesign --verify --strict out/macsteam.dylib
          tar -tzf out/macsteam-standalone.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "steam-$STEAM_VERSION" out/macsteam-standalone.tar.gz \
            --target "$GITHUB_SHA" \
            --title "steam-$STEAM_VERSION" \
            --notes "Standalone macsteam bundle targeting Steam $STEAM_VERSION."
